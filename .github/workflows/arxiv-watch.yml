name: arXiv watch

# By hand only. The daily check runs inside the Notifications workflow (scripts/notify.py),
# every day after 05:00 UTC, because GitHub skipped the scheduled runs of this one.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r scripts/requirements.txt
      - name: Check arXiv
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DASHBOARD_UID: ${{ secrets.DASHBOARD_UID }}
        run: .venv/bin/python scripts/arxiv_watch.py
